name: papercraft_example
description: "Standalone Papercraft app — the go_router shell (dashboard route,
  login/register, mock auth) that demonstrates the embeddable library widgets.
  Run: flutter run -t lib/main_dev.dart"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  papercraft:
    path: ../
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  go_router: ^14.0.0
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.0
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
