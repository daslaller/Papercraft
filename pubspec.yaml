name: papercraft
description: "Papercraft — Label and document designer"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  shared_preferences: ^2.3.0
  uuid: ^4.4.0
  google_fonts: ^6.2.1
  http: ^1.2.0
  pdf: ^3.10.8
  printing: ^5.13.0
  # Symbology encoders, shared by the PDF painter (through pdf's
  # pw.BarcodeWidget) and the canvas painter, so the QR matrix drawn in the
  # editor is the one that prints. Already resolved transitively via `pdf`;
  # declared because lib/ now imports it directly.
  barcode: ^2.2.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
